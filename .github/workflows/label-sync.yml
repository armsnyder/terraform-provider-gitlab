# GitHub Action reference: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
#
# This workflow synchronizes this GitHub repository's labels from a config file.

name: label-sync

on:
  # When label config is updated.
  push:
    branches:
      - main
      - master
    paths:
      - .github/labels.yml
  # When a label is updated out-of-band.
  # Note that this workflow itself will not trigger the "label" event.
  label: {}

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      # Label Sync docs: https://github.com/marketplace/actions/label-sync
      # - uses: EndBug/label-sync@v2
      - uses: Shresht7/SynLabels-Action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
